name: CI Pipeline - MedScan AI Backend

on:
  push:
    branches: [main, develop]
    # Filtro de paths: solo ejecuta el pipeline cuando el commit modifica código Java,
    # dependencias o configuraciones críticas de ejecución del backend (Issue #22)
    paths:
      - '**/*.java'
      - 'pom.xml'
      - 'src/main/resources/**'
      - 'src/test/resources/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.java'
      - 'pom.xml'
      - 'src/main/resources/**'
      - 'src/test/resources/**'
      - 'Dockerfile'
      - '.github/workflows/**'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # FASE 1: INTEGRACIÓN CONTINUA (CI) - Build, Pruebas y Seguridad de Dependencias
  # ============================================================================
  build-and-test:
    name: 1. Build, Tests & Snyk (SCA/SAST)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: medscan_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medscan_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 25 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x ./mvnw

      - name: Esperar disponibilidad de PostgreSQL (Healthcheck & Readiness)
        run: |
          echo "Verificando disponibilidad del contenedor PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d medscan_db; then
              echo "✅ PostgreSQL está listo y respondiendo correctamente."
              break
            fi
            echo "Esperando inicialización de PostgreSQL (intento $i/30)..."
            sleep 1
          done

      - name: Compilación, verificación y pruebas unitarias/integración
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: test_jwt_secret_at_least_32_characters_long_123456
          SCAN_OPENAI_API_KEY: test_key
        run: ./mvnw -B clean verify

      # ------------------------------------------------------------------------
      # ANÁLISIS DE VULNERABILIDADES: SNYK (SCA de Dependencias Maven y SAST)
      # ------------------------------------------------------------------------
      - name: Análisis de vulnerabilidades de dependencias con Snyk
        uses: snyk/actions/maven@master
        continue-on-error: true # Permite auditar sin romper el pipeline si no hay token configurado
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ============================================================================
  # FASE 2: ESCANEO DE SEGURIDAD EN CONTENEDOR DOCKER (Grype CVEs)
  # ============================================================================
  container-security-scan:
    name: 2. Docker Build & Grype (Container Vulnerabilities)
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validación de construcción en runner efímero de CI
      - name: Construir imagen Docker de producción (--target production)
        run: |
          docker build --target production -t medscan-backend:scan-target .

      - name: Construir imagen Docker de desarrollo (--target development) para validar paridad
        run: |
          docker build --target development -t medscan-backend:dev-verify .

      # ------------------------------------------------------------------------
      # ANÁLISIS DE VULNERABILIDADES: GRYPE (Escaneo de CVEs en SO Alpine y capas)
      # ------------------------------------------------------------------------
      - name: Escaneo de vulnerabilidades con Grype (Anchore)
        uses: anchore/scan-action@v3
        with:
          image: "medscan-backend:scan-target"
          fail-build: false
          severity-cutoff: high
