# ==============================================================================
# Perfil de Producción Estricto (prod) - Cumplimiento 12-Factor App
# ==============================================================================
spring:
  datasource:
    # Exige obligatoriamente variables de entorno sin valores por defecto inseguros (Factor III)
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    # Prohibido 'update' en producción; se valida el esquema generado por Flyway (Factor X)
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    # Exige clave secreta real desde el entorno
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  scan:
    openai:
      api-key: ${SCAN_OPENAI_API_KEY}
