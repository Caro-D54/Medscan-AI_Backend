spring:
  application:
    name: app-med
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
  hikari: 
    maximum-pool-size: 5
    minimum-idle: 3
    idle-timeout: 30000
    max-lifetime: 1800000
    connection-timeout: 30000
  
  connection-test-query: SELECT 1 FROM DUAL 
    initialization
  mode: always

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
